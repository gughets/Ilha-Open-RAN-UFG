---

global:
  imagePullPolicy: Always
  
  # Global network parametes
  n3network:
    enabled: false
    name: n3network
    type: macvlan
    masterIf: dados
    subnetIP: 10.21.2.0
    cidr: 24
    gatewayIP: 10.21.2.109
    excludeIP: 10.21.2.109
  n4network:
    enabled: false
    name: n4network
    type: macvlan
    masterIf: dados
    subnetIP: 10.21.2.0
    cidr: 24
    gatewayIP: 10.21.2.109
    excludeIP: 10.21.2.109
  n6network:
    enabled: false
    name: n6network
    type: macvlan
    masterIf: access
    subnetIP: 10.21.0.0
    cidr: 24
    gatewayIP: 10.21.0.100
    excludeIP: 10.21.0.100
  n9network:
    enabled: false
    name: n9network
    type: macvlan
    masterIf: dados
    subnetIP: 10.21.2.0
    cidr: 24
    gatewayIP: 10.21.2.109
    excludeIP: 10.21.2.109

# network paramters
hostNetwork: true
n3if:  # GTP-U
  ipAddress: 10.21.2.80
n9if:  # GTP-U
  ipAddress: 10.21.2.81
n4if:  # PFCP
  ipAddress: 10.21.2.82
n6if:  # DN
  ipAddress: 10.21.0.83

deploymentStrategy:
  type: Recreate  ## TODO: add it to other charts that use multus-cni :)

nodeSelector: 
  kubernetes.io/hostname: oran-cloud5

image:
  # tag: 0ac3d9fb28808dbca7e123205323e2c09f377971@sha256:a03bdd30efa623b0d3ddc99d9a6472453a43d2d64ed715a9a042e893d82ffb68
  registry: ghcr.io
  repository: edgecomllc
  name: eupf
  tag: 0.7.0
  pullPolicy: Always

args:
  - --config
  - /app/conf/config.yml

env:
  UPF_INTERFACE_NAME: "access"
  UPF_XDP_ATTACH_MODE: generic
  UPF_API_ADDRESS: ":8080"
  UPF_PFCP_ADDRESS: 10.21.0.5:8805
  UPF_PFCP_NODE_ID: 10.21.0.5
  UPF_ASSOCIATION_SETUP_TIMEOUT: 5
  UPF_METRICS_ADDRESS: :9090
  UPF_N3_ADDRESS: 10.21.0.5
  UPF_N9_ADDRESS: 10.21.0.5
  UPF_FEATURE_UEIP: true
  UPF_FEATURE_FTUP: true
  UPF_UEIP_POOL: 10.45.0.0/16
  UPF_TEID_POOL: 65535

configMaps:
  config:
    data:
      config.yml: |
        logging_level: info

volumes:
  - name: sys
    hostPath:
      path: /sys
  - name: config
    configMap:
      name: eupf-config
      defaultMode: 420
      items:
        - key: config.yml
          mode: 493
          path: config.yml

volumeMounts:
  - name: sys
    mountPath: /sys
    readOnly:  true
  - name: config
    mountPath: /app/conf

bird:
  enabled: false
  image: docker.io/edgecom/bird:0.0.5
  env:
    BIRD_LOCAL_AS: 65001
    BIRD_LOCAL_PREFIX: 10.45.0.0/16
  livenessProbe: null # FIXME: It's not working
  readinessProbe: null # FIXME: It's not working

metrics:
  enabled: false
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
    endpoints:
      port: metrics
      path: "/metrics"

# podAnnotations:
#   cni.projectcalico.org/ipv4pools: '["default-pool"]'
#   cni.projectcalico.org/ipAddrs: '["172.17.100.2"]'

# podSecurityContext:
#   sysctls:
#   - name: net.ipv4.ip_forward
#     value: "1"

securityContext:
  privileged: true
  capabilities:
    add: ["NET_ADMIN"]

extraContainerPorts:
  - name: gtpu
    containerPort: 2152
    protocol: UDP
  - name: pfcp
    containerPort: 8805
    protocol: UDP

service:
  type: ClusterIP
  port: 8080
  extraPorts:
    - port: 2152
      targetPort: gtpu
      protocol: UDP
      name: gtpu
    - port: 8805
      targetPort: pfcp
      protocol: UDP
      name: pfcp

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

# FIXME: It's not working
# livenessProbe:
#   tcpSocket:
#     host: localhost
#     port: http
#   initialDelaySeconds: 5
#   periodSeconds: 10

# readinessProbe:
#   tcpSocket:
#     host: localhost
#     port: http
#   initialDelaySeconds: 5
#   periodSeconds: 10

ui:
  enabled: true
  image:
    registry: ghcr.io
    repository: edgecomllc
    name: eupf-ui
    tag: 92294e11a733790ae2872dd1bc3128ce1a550734
    pullPolicy: Always
  env:
    API_ADDR: localhost:8080
  livenessProbe: null # FIXME: It's not working
  readinessProbe: null # FIXME: It's not working