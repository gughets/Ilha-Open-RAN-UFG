global:
  # Global network parametes
  n3network:
    enabled: true
    name: n3network
    type: sriov
    subnetIP: 10.23.31.0
    cidr: 24
    vlan: 3231 # sriov only
  n4network:
    enabled: true
    name: n4network
    type: sriov
    subnetIP: 10.23.32.0
    cidr: 24
    vlan: 3232 # sriov only
  n6network:
    enabled: true
    name: n6network
    type: sriov
    subnetIP: 10.21.0.0
    cidr: 24
    vlan: 3223 # sriov only

# network paramters
hostNetwork: false

networkConfig:
  n3if:  # GTP-U
    ipAddress: 10.23.31.52
  n4if:  # PFCP
    ipAddress: 10.23.32.52
  n6if:  # Data
    ifname: n6
    ipAddress: 10.21.0.241
    gateway: 10.21.0.242

configMaps:
  config:
    data:
      config.yml: |
        logging_level: info
        interface_name: [n3, n6]
        xdp_attach_mode: generic # native or offload
        api_address: :8080
        pfcp_address: 10.23.32.52:8805
        pfcp_node_id: 10.23.32.52
        pfcp_remote_node: 10.23.32.51
        association_setup_timeout: 5
        metrics_address: :9090
        n3_address: 10.23.31.52
        gtp_echo_interval: 10
        qer_map_size: 1024
        far_map_size: 1024
        urr_map_size: 1024
        pdr_map_size: 1024
        max_sessions: 65535
        heartbeat_retries: 3
        heartbeat_interval: 5
        heartbeat_timeout: 5
        feature_ueip: true
        feature_ftup: true
        ueip_pool: 10.45.0.0/16
        teid_pool: 65535

deploymentStrategy:
  type: Recreate

deploymentType: deployment # or statefulset

image:
  registry: ghcr.io
  repository: edgecomllc
  name: eupf
  tag: 0.7.1
  pullPolicy: Always

# args:
#   - --config
#   - /app/conf/config.yml

volumes:
  - name: sys
    hostPath:
      path: /sys
  - name: config
    configMap:
      name: eupf-config
      defaultMode: 0644
      items:
        - key: config.yml
          mode: 493
          path: config.yml

volumeMounts:
  - name: sys
    mountPath: /sys
    readOnly:  true
  - name: config
    mountPath: /app/conf

bird:
  enabled: false
  image: docker.io/edgecom/bird:0.0.5
  service:
    enabled: false
    type: ClusterIP
    port: 179
  env:
    BIRD_ROUTER_ID: $(MY_POD_IP)
    BIRD_NEIGHBOR_IP: $(MY_NODE_IP)
    BIRD_NEIGHBOR_AS: 64512
    BIRD_LOCAL_AS: 65001
    BIRD_LOCAL_PREFIX: 10.45.0.0/16

xdpProgrammInstall:
  enabled: false
  securityContext:
    capabilities:
      add:
        - NET_ADMIN
        - BPF
    privileged: true
    runAsNonRoot: false
  env:
    - name: POD_N6_IP
      value: 10.21.0.241
  command:
    - /bin/sh
    - -c
    - |
      apk add iproute2; \
      echo "starting"; \
      i=0; IFACE_NAME=""; \
      while [ -z "$IFACE_NAME" ]; \
      do \
        echo "check $i: searching interface name"; sleep 1; \
        IFACE_NAME=$(ip route list ${POD_N6_IP} | awk '{print $3}'); \
        i=$((i+1)); \
      done ;\
      echo "done: current interface name is ${IFACE_NAME}" ;\
      set -x ;\
      ls -alh /app ;\
      ip link set dev ${IFACE_NAME} xdpdrv obj /app/zeroentrypoint_bpf.o sec xdp/upf_zero_entrypoint

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

metrics:
  enabled: false
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
    endpoints:
      port: metrics
      path: "/metrics"

podAnnotations: {}
  # cni.projectcalico.org/ipv4pools: '["default-pool"]'
  # cni.projectcalico.org/ipAddrs: '["172.2.0.100"]' # also change in the calico-bgp-ue-pool.yaml file

podSecurityContext: {}

securityContext:
  privileged: true
  capabilities:
    add: ["NET_ADMIN", "SYS_ADMIN"]

extraContainerPorts:
  - name: gtpu
    containerPort: 2152
    protocol: UDP
  - name: pfcp
    containerPort: 8805
    protocol: UDP

service:
  type: ClusterIP
  port: 8080
  extraPorts:
    - port: 2152
      targetPort: gtpu
      protocol: UDP
      name: gtpu
    - port: 8805
      targetPort: pfcp
      protocol: UDP
      name: pfcp

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 4000m
    memory: 4Gi
  requests:
    cpu: 1000m
    memory: 2Gi

# TODO: Fix this probes with multi-interface eupf
livenessProbe:
  exec:
    command:
      - sh
      - -c
      - "nc -z -v 127.0.0.1 8080"
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  exec:
    command:
      - sh
      - -c
      - "nc -z -v 127.0.0.1 8080"
  initialDelaySeconds: 5
  periodSeconds: 10

ui:
  enabled: false
  image:
    registry: ghcr.io
    repository: edgecomllc
    name: eupf-ui
    tag: 92294e11a733790ae2872dd1bc3128ce1a550734
    pullPolicy: Always
  service:
    port: 8081
  env:
    API_ADDR: localhost:8080