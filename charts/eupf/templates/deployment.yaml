{{- if eq .Values.deploymentType "deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eupf.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "eupf.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "eupf.selectorLabels" . | nindent 6 }}
  {{- with .Values.deploymentStrategy }}
  strategy:
    {{- toYaml . | trim | nindent 4 }}
  {{- end }}
  template:
    metadata:
      annotations:
        k8s.v1.cni.cncf.io/networks: >-
          [
            {{- $first := true }}
            {{- if .Values.global.n3network.enabled }}
              {{- if not $first }},{{- end }}
              {{- $first = false }}
              {
                "name": "{{ .Release.Name }}-{{ .Values.global.n3network.name }}-eupf",
                "interface": "n3"
                {{- if ne .Values.global.n3network.type "passthrough" }},
                "ips": [ "{{ .Values.networkConfig.n3if.ipAddress }}/{{ .Values.global.n3network.cidr }}" ]
                {{- end }}
              }
            {{- end }}

            {{- if .Values.global.n4network.enabled }}
              {{- if not $first }},{{- end }}
              {{- $first = false }}
              {
                "name": "{{ .Release.Name }}-{{ .Values.global.n4network.name }}-eupf",
                "interface": "n4"
                {{- if ne .Values.global.n4network.type "passthrough" }},
                "ips": [ "{{ .Values.networkConfig.n4if.ipAddress }}/{{ .Values.global.n4network.cidr }}" ]
                {{- end }}
              }
            {{- end }}

            {{- if .Values.global.n6network.enabled }}
              {{- if not $first }},{{- end }}
              {{- $first = false }}
              {
                "name": "{{ .Release.Name }}-{{ .Values.global.n6network.name }}-eupf",
                "interface": "n6"
                {{- if ne .Values.global.n6network.type "passthrough" }},
                "ips": [ "{{ .Values.networkConfig.n6if.ipAddress }}/{{ .Values.global.n6network.cidr }}" ]
                {{- end }}
              }
            {{- end }}
          ]
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 10 }}
        {{- end }}
      labels:
        {{- include "eupf.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      hostNetwork: {{ .Values.hostNetwork | default false }}
      serviceAccountName: {{ include "eupf.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.initContainers }}
      initContainers:
        {{- include "helpers.pod.initContainers" . | nindent 8 }}
      {{- end }}
      containers:
        - name: eupf
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ include "helpers.pod.containerImage" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "ifNotPresent" }}
          # {{- if .Values.command }}
          # command: {{- include "helpers.common.tplvalues.render" (dict "value" .Values.command "context" $) | nindent 12 }}
          # {{- end }}
          # {{- if .Values.args }}
          # args: {{- include "helpers.common.tplvalues.render" (dict "value" .Values.args "context" $) | nindent 12 }}
          # {{- end }}
          command:
            - sh
            - -c
            - |
              apk add --no-cache iproute2
              
              sysctl -w net.ipv4.ip_forward=1

              ip route add default via {{ .Values.networkConfig.n6if.gateway }} dev {{ .Values.networkConfig.n6if.ifname }} table 100
              # ip route replace default via {{ .Values.networkConfig.n6if.gateway }} dev {{ .Values.networkConfig.n6if.ifname }}

              ip rule add from {{ .Values.networkConfig.n6if.ipAddress }} table 100

              /app/bin/eupf --config /app/conf/config.yml
          {{- if .Values.env }}
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MY_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            {{- include "helpers.pod.envs" . | indent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if .Values.extraContainerPorts }}
            {{- include "helpers.common.tplvalues.render" (dict "value" .Values.extraContainerPorts "context" $) | nindent 12 }}
            {{- end }}
          # {{- include "helpers.pod.probes" . | nindent 10 }}
        {{- with .Values.livenessProbe }}
          livenessProbe:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with .Values.readinessProbe }}
          readinessProbe:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with .Values.startupProbe }}
          startupProbe:
          {{- toYaml . | nindent 12 }}
        {{- end }}
          resources:
            limits:
              {{- $count := 0 }}
              {{- $networks := dict "n3network" $.Values.global.n3network "n4network" $.Values.global.n4network "n6network" $.Values.global.n6network }}
              {{- range $name, $net := $networks }}
                {{- if and $net.enabled (eq $net.type "sriov") }}
                  {{- $count = add $count 1 }}
                {{- end }}
              {{- end }}
              rnp.br/intel_sriov_netdevice: "{{ $count }}"
              {{- with .Values.resources.limits }}{{ toYaml . | nindent 14 }}{{- end }}
            requests:
              {{- $count := 0 }}
              {{- $networks := dict "n3network" $.Values.global.n3network "n4network" $.Values.global.n4network "n6network" $.Values.global.n6network }}
              {{- range $name, $net := $networks }}
                {{- if and $net.enabled (eq $net.type "sriov") }}
                  {{- $count = add $count 1 }}
                {{- end }}
              {{- end }}
              rnp.br/intel_sriov_netdevice: "{{ $count }}"          
              {{- with .Values.resources.requests }}{{ toYaml . | nindent 14 }}{{- end }}
          {{- include "helpers.pod.volumeMounts" . | nindent 10 }}
        {{- if .Values.bird.enabled }}
        - name: bird
          image: {{ .Values.bird.image }}
          {{- if .Values.bird.command }}
          command: {{- include "helpers.common.tplvalues.render" (dict "value" .Values.bird.command "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.bird.args }}
          args: {{- include "helpers.common.tplvalues.render" (dict "value" .Values.bird.args "context" $) | nindent 12 }}
          {{- end }}
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MY_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            {{- range $k, $v := .Values.bird.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: bgp
              containerPort: {{ .Values.bird.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.bird.resources | nindent 12 }}
          {{- with .Values.bird.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.bird.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "helpers.pod.volumeMounts" . | nindent 10 }}
        {{- end }}
        {{- if .Values.ui.enabled }}
        - name:  ui
          image: "{{ include "helpers.pod.uiImage" . }}"
          {{- if .Values.ui.command }}
          command: {{- include "helpers.common.tplvalues.render" (dict "value" .Values.ui.command "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.ui.args }}
          args: {{- include "helpers.common.tplvalues.render" (dict "value" .Values.ui.args "context" $) | nindent 12 }}
          {{- end }}
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MY_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            {{- range $k, $v := .Values.ui.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: ui
              containerPort: {{ .Values.ui.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          {{- with .Values.ui.livenessProbe | default dict }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.readinessProbe | default dict }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "helpers.pod.volumeMounts" . | nindent 10 }}
        {{- end }}
      {{- include "helpers.pod.volumes" . | nindent 6 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
