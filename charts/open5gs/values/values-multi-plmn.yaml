  nodeSelector:
    kubernetes.io/hostname: oran-cloud5

udm:
  enabled: true
  image:
    registry: docker.io
    repository: gradiant/open5gs
    tag: "2.7.6"
  nodeSelector:
    kubernetes.io/hostname: oran-cloud5
    
udr:
  enabled: true
  image:
    registry: docker.io
    repository: gradiant/open5gs
    tag: "2.7.6"
  nodeSelector:
    kubernetes.io/hostname: oran-cloud5