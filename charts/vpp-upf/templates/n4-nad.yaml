{{- if .Values.global.n4network.enabled }}

apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: {{ .Release.Name }}-{{ .Values.global.n4network.name }}-vpp-upf
  annotations:
    k8s.v1.cni.cncf.io/resourceName: {{ .Values.config.vpp.dpdk_devices.n4ResourceName | quote }}
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "{{ .Release.Name }}-{{ .Values.global.n4network.name }}-vpp-upf",
      "type": "sriov",
      "vlan": {{ .Values.global.n4network.vlan | default 0 | int }},
      "spoofchk": "off",
      "trust": "on"
    }

{{- end }}