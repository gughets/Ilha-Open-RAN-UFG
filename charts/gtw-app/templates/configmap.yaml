kind: ConfigMap
apiVersion: v1
metadata:
  name: configuration
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "gtw-app.name" . }}
    chart: {{ include "gtw-app.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
data:
    entrypoint.bash: |
        #!/bin/bash
        set -euo pipefail

        # Colors for output
        GREEN='\033[0;32m'
        YELLOW='\033[1;33m'
        NC='\033[0m' # No Color

        echo -e "${GREEN}Starting GTW-APP...${NC}"

        # Enable IP forwarding
        echo -e "${YELLOW}Enabling IP forwarding...${NC}"
        sysctl -w net.ipv4.ip_forward=1

        # Configure NAT for UE subnet
        echo -e "${YELLOW}Setting up NAT for UE subnet: {{ .Values.config.ueSubnet }}${NC}"
        iptables -t nat -A POSTROUTING -s {{ .Values.config.ueSubnet }} -o gtw -j MASQUERADE

        # Add route to UPF
        echo -e "${YELLOW}Adding route to UPF N6: {{ .Values.config.upfN6 }} via interface gtw${NC}"
        ip route add {{ .Values.config.ueSubnet }} via {{ .Values.config.upfN6 }} dev gtw

        # Set default route via site router
        echo -e "${YELLOW}Setting default route via site router: {{ .Values.config.siteRouter }}${NC}"
        ip route del default
        ip route add default via {{ .Values.config.siteRouter }} dev gtw

        # Show current configuration for review
        echo -e "${GREEN}Current routing table:${NC}"
        ip route show

        echo -e "${GREEN}Current NAT table (POSTROUTING):${NC}"
        iptables -t nat -L POSTROUTING -n -v

        echo -e "${GREEN}GTW-APP is running and ready.${NC}"
        echo ""

        # Keep the container running
        tail -f /dev/null
  