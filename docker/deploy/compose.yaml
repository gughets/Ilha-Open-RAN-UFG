services:
  vpp-upf:
    container_name: vpp-upf
    image: muriloavlis/vpp-upf:v22.10.1
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/vfio/vfio
      - /dev/vfio/263
      - /dev/vfio/264
      - /dev/vfio/265
      - /dev/hugepages
    volumes:
      - ../config/upf-init.conf:/etc/vpp/init.conf
      - ../config/vpp-startup.conf:/etc/vpp/startup.conf
    restart: unless-stopped

  dn-gateway:
    container_name: dn-gateway
    image: debian:stable-slim
    privileged: true
    networks:
      upf_net:
        ipv4_address: 10.21.1.67 # DN-GW IP
    cap_add:
      - NET_ADMIN
    command: 
      - sh
      - -c
      - |
        apt-get update && apt-get install -y iproute2 iptables iputils-ping
        sysctl -w net.ipv4.ip_forward=1
        iptables -t nat -A POSTROUTING -s 10.45.0.0/16 -j MASQUERADE
        ip route add 10.45.0.0/16 via 10.21.1.64
        
networks:
  upf_net:
    name: upf_net
    driver: bridge
    ipam:
      config:
        - subnet: 10.21.1.0/24
