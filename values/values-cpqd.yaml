dbURI: "mongodb://{{ .Release.Name }}-mongodb/open5gs"

global:
  # Global network parametes
  n2network:
    enabled: true
    name: n2network
    type: macvlan
    masterIf: enp1s0
    subnetIP: 10.19.0.0
    cidr: 24
    gatewayIP: 10.19.0.1
    excludeIP: 10.19.0.117
  n3network:
    enabled: true
    name: n3network
    type: macvlan
    masterIf: enp1s0
    subnetIP: 10.19.0.0
    cidr: 24
    gatewayIP: 10.19.0.1
    excludeIP: 10.19.0.117
  n4network:
    enabled: true
    name: n4network
    type: macvlan
    masterIf: enp1s0
    subnetIP: 10.19.0.0
    cidr: 24
    gatewayIP: 10.19.0.1
    excludeIP: 10.19.0.117

populate:
  enabled: true
  image:
    registry: docker.io
    repository: gradiant/open5gs-dbctl
    tag: 0.10.3
    pullPolicy: IfNotPresent
  initCommands:
  # example of initCommands: IMSI - Key - OPc - DNN - SST - SD
  #  - open5gs-dbctl add 999700000000001 465B5CE8B199B49FAA5F0A2EE238A6BC E8ED289DEBA952E4283B54E88E6183CA
  #  - open5gs-dbctl add_ue_with_apn 999700000000002 465B5CE8B199B49FAA5F0A2EE238A6BC E8ED289DEBA952E4283B54E88E6183CA internet
  #  - open5gs-dbctl add_ue_with_slice 999700000000003 465B5CE8B199B49FAA5F0A2EE238A6BC E8ED289DEBA952E4283B54E88E6183CA internet 1 111111
    - open5gs-dbctl add_ue_with_slice 999990000000008 0CB5DB1818B1302289DD02C262169359 0E585463F4BCDAA65ABA6EE50D25895B oranbr 1 FFFFFF # Smartphone

# Common
mongodb:
  enabled: true
  image:
    tag: "8.0"
  auth:
    enabled: false
  global:
    storageClass: openebs-hostpath
  nodeSelector:
    kubernetes.io/hostname: core

smf:
  enabled: true
  updateStrategy:
    type: Recreate
  livenessProbe:
    enabled: false
  readinessProbe:
    enabled: false
  image:
    registry: docker.io
    repository: gradiant/open5gs
    tag: "2.7.5"
  config:
    n4if:
      ipAddress: "10.19.0.181"
    upf:
      pfcp:
        hostname: "10.19.0.183"
        port: 8805
    pcrf:
      enabled: false
    dnsList:
    - 8.8.8.8
    - 8.8.4.4
    - 2001:4860:4860::8888
    - 2001:4860:4860::8844
    subnetList:
      - subnet: 10.45.0.0/16
        gateway: 10.45.0.1
        dnn: oranbr
    mtu: 1450
  nodeSelector:
    kubernetes.io/hostname: core

# TODO
eupf:
  enabled: false

upf:
  enabled: true
  updateStrategy:
    type: Recreate
  image:
    registry: docker.io
    repository: gradiant/open5gs
    tag: "2.7.5"
  podSecurityContext:
    enabled: true
    fsGroup: 0
  containerSecurityContext:
    enabled: true
    runAsUser: 0
    privileged: true
    capabilities:
      add: ["NET_ADMIN"]
  config:
    hostNetwork: false ## Needed to connect N3/GTP-U in multi-cluster scenario
    n3if:
      ipAddress: "10.19.0.182"
    n4if:
      ipAddress: "10.19.0.183"
    upf:
      pfcp:
        dev: "n4" # if hostNetwork is false
        # addr: "10.21.2.2"
      gtpu:
        dev: "n3" # if hostNetwork is false
        # addr: "10.21.2.2"
    subnetList:
    - subnet: 10.45.0.0/16
      gateway: 10.45.0.1
      dnn: oranbr
      dev: ogstun
      mask: 16
      createDev: true
      enableNAT: true
  nodeSelector:
    kubernetes.io/hostname: core

webui:
  enabled: true
  image:
    registry: docker.io
    repository: gradiant/open5gs-webui
    tag: "2.7.5"
  services:
    http:
      type: "NodePort"
      nodePorts:
        http: "30999"
  nodeSelector:
    kubernetes.io/hostname: core

# 4G (disabled)
hss:
  enabled: false
mme:
  enabled: false
pcrf:
  enabled: false
sgwc:
  enabled: false
sgwu:
  enabled: false

# 5G
amf:
  enabled: true
  updateStrategy:
    type: Recreate  
  livenessProbe:
    enabled: false
  readinessProbe:
    enabled: false
  image:
    registry: docker.io
    repository: gradiant/open5gs
    tag: "2.7.5"
  config:
    logLevel: info
    n2if:
      ipAddress: "10.19.0.180"
    guamiList:
      - plmn_id:
          mcc: "001"
          mnc: "01"
        amf_id:
          region: 1
          set: 1
      - plmn_id:
          mcc: "999"
          mnc: "99"
        amf_id:
          region: 1
          set: 1
    taiList:
      - plmn_id:
          mcc: "001"
          mnc: "01"
        tac: [1]
      - plmn_id:
          mcc: "999"
          mnc: "99"
        tac: [1]
    plmnList:
      - plmn_id:
          mcc: "001"
          mnc: "01"
        s_nssai:
          - sst: 1
            sd: "0xFFFFFF"
      - plmn_id:
          mcc: "999"
          mnc: "99"
        s_nssai:
          - sst: 1
            sd: "0xFFFFFF"
    networkName: OPENRANBR-5GS
  nodeSelector:
    kubernetes.io/hostname: core

ausf:
  enabled: true
  image:
    registry: docker.io
    repository: gradiant/open5gs
    tag: "2.7.5"
  nodeSelector:
    kubernetes.io/hostname: core

bsf:
  enabled: true
  image:
    registry: docker.io
    repository: gradiant/open5gs
    tag: "2.7.5"
  nodeSelector:
    kubernetes.io/hostname: core

nrf:
  enabled: true
  image:
    registry: docker.io
    repository: gradiant/open5gs
    tag: "2.7.5"
  config:
    logLevel: info
    servingList:
      - plmn_id:
          mcc: "001"
          mnc: "01"
      - plmn_id:
          mcc: "999"
          mnc: "99"
  nodeSelector:
    kubernetes.io/hostname: core

nssf:
  enabled: true
  image:
    registry: docker.io
    repository: gradiant/open5gs
    tag: "2.7.5"
  config:
    nsiList:
      - uri: ""
        sst: 1
        sd: "0xFFFFFF"
  nodeSelector:
    kubernetes.io/hostname: core

pcf:
  enabled: true
  image:
    registry: docker.io
    repository: gradiant/open5gs
    tag: "2.7.5"
  mongodb:
    enabled: false
  nodeSelector:
    kubernetes.io/hostname: core

scp:
  enabled: true
  image:
    registry: docker.io
    repository: gradiant/open5gs
    tag: "2.7.5"
  mongodb:
    enabled: false
  nodeSelector:
    kubernetes.io/hostname: core

udm:
  enabled: true
  image:
    registry: docker.io
    repository: gradiant/open5gs
    tag: "2.7.5"
  nodeSelector:
    kubernetes.io/hostname: core
    
udr:
  enabled: true
  image:
    registry: docker.io
    repository: gradiant/open5gs
    tag: "2.7.5"
  nodeSelector:
    kubernetes.io/hostname: core