dbURI: "mongodb://{{ .Release.Name }}-mongodb/open5gs"

global:
  # Global network parametes
  n2network: 
    enabled: true
    name: n2network
    type: macvlan
    masterIf: dados
    subnetIP: 10.21.2.0
    cidr: 24
    gatewayIP: 10.21.2.109
    excludeIP: 10.21.2.109
  n3network:
    enabled: true
    name: n3network
    type: macvlan
    masterIf: dados
    subnetIP: 10.21.2.0
    cidr: 24
    gatewayIP: 10.21.2.109
    excludeIP: 10.21.2.109
  n4network:
    enabled: true
    name: n4network
    type: macvlan
    masterIf: dados
    subnetIP: 10.21.2.0
    cidr: 24
    gatewayIP: 10.21.2.109
    excludeIP: 10.21.2.109

populate:
  enabled: true
  image:
    registry: docker.io
    repository: gradiant/open5gs-dbctl
    tag: 0.10.3
    pullPolicy: IfNotPresent
  initCommands:
  # example of initCommands:
  #  - open5gs-dbctl add 999700000000001 465B5CE8B199B49FAA5F0A2EE238A6BC E8ED289DEBA952E4283B54E88E6183CA
  #  - open5gs-dbctl add_ue_with_apn 999700000000002 465B5CE8B199B49FAA5F0A2EE238A6BC E8ED289DEBA952E4283B54E88E6183CA internet
  #  - open5gs-dbctl add_ue_with_slice 999700000000003 465B5CE8B199B49FAA5F0A2EE238A6BC E8ED289DEBA952E4283B54E88E6183CA internet 1 111111
    - open5gs-dbctl add_ue_with_slice 001010000021001 00112233445566778899AABBCCDDEEFF 279EB54971771559879284FDDDE3EE0C oranbr 1 FFFFFF # CPE
    - open5gs-dbctl add_ue_with_slice 001010000021002 00112233445566778899AABBCCDDEEFF 279EB54971771559879284FDDDE3EE0C oranbr 1 FFFFFF # CELLPHONE-1
    - open5gs-dbctl add_ue_with_slice 901700000041589 16FC086F3BBCA529B7221C08E4F6DFE3 51680E453DD972FBA105C7D2EAFE8613 oranbr 1 FFFFFF # CELLPHONE-2
    - open5gs-dbctl add_ue_with_slice 901700000041596 C27D1C24D7AEA00A71C8868007D6B3F7 87D0D9F22D90EF6C7933494C872D2897 oranbr 1 FFFFFF # RASP-1

# Common
mongodb:
  enabled: true
  image:
    tag: "8.0"
  auth:
    enabled: false
  global:
    storageClass: openebs-hostpath
  nodeSelector:
    kubernetes.io/hostname: oran-cloud6

smf:
  enabled: true
  updateStrategy:
    type: Recreate  
  image:
    registry: docker.io
    repository: gradiant/open5gs
    tag: "2.7.5"
  config:
    n4if:
      ipAddress: "10.21.2.59"
    upf:
      pfcp:
        hostname: "10.21.2.61"
        port: 8805
    pcrf:
      enabled: false
    dnsList:
    - 8.8.8.8
    - 8.8.4.4
    - 2001:4860:4860::8888
    - 2001:4860:4860::8844
    subnetList:
      - subnet: 10.45.0.0/16
        gateway: 10.45.0.1
        dnn: oranbr
  mtu: 1500
  nodeSelector:
    kubernetes.io/hostname: oran-cloud6

# TODO
eupf:
  enabled: false
  
upf:
  enabled: true
  updateStrategy:
    type: Recreate
  image:
    registry: docker.io
    repository: gradiant/open5gs
    tag: "2.7.5"
  config:
    hostNetwork: false ## Needed to connect N3/GTP-U in multi-cluster scenario
    n3if:
      ipAddress: "10.21.2.60"
    n4if:
      ipAddress: "10.21.2.61"
    upf:
      pfcp:
        dev: "n4" # if hostNetwork is false
        # addr: "10.21.2.2"
      gtpu:
        dev: "n3" # if hostNetwork is false
        # addr: "10.21.2.2"
    subnetList:
    - subnet: 10.45.0.0/16
      gateway: 10.45.0.1
      dnn: oranbr
      dev: ogstun
      mask: 16
      createDev: true
      enableNAT: true
  nodeSelector:
    kubernetes.io/hostname: oran-cloud6

webui:
  enabled: true
  image:
    registry: docker.io
    repository: gradiant/open5gs-webui
    tag: "2.7.5"
  services:
    http:
      type: "NodePort"
      nodePorts:
        http: "30999"
  nodeSelector:
    kubernetes.io/hostname: oran-cloud6

# 4G (disabled)
hss:
  enabled: false
mme:
  enabled: false
pcrf:
  enabled: false
sgwc:
  enabled: false
sgwu:
  enabled: false

# 5G
amf:
  enabled: true
  updateStrategy:
    type: Recreate  
  image:
    registry: docker.io
    repository: gradiant/open5gs
    tag: "2.7.5"
  config:
    logLevel: info
    n2if:
      ipAddress: "10.21.2.58"
    guamiList:
      - plmn_id:
          mcc: "001"
          mnc: "01"
        amf_id:
          region: 1
          set: 1
      - plmn_id:
          mcc: "901"
          mnc: "70"
        amf_id:
          region: 1
          set: 1
    taiList:
      - plmn_id:
          mcc: "001"
          mnc: "01"
        tac: [1]
      - plmn_id:
          mcc: "901"
          mnc: "70"
        tac: [1]
    plmnList:
      - plmn_id:
          mcc: "001"
          mnc: "01"
        s_nssai:
          - sst: 1
            sd: "0xFFFFFF"
    networkName: OPENRANBR-6
  nodeSelector:
    kubernetes.io/hostname: oran-cloud6

ausf:
  enabled: true
  image:
    registry: docker.io
    repository: gradiant/open5gs
    tag: "2.7.5"
  nodeSelector:
    kubernetes.io/hostname: oran-cloud6

bsf:
  enabled: true
  image:
    registry: docker.io
    repository: gradiant/open5gs
    tag: "2.7.5"
  nodeSelector:
    kubernetes.io/hostname: oran-cloud6

nrf:
  enabled: true
  image:
    registry: docker.io
    repository: gradiant/open5gs
    tag: "2.7.5"
  config:
    logLevel: info
    servingList:
      - plmn_id:
          mcc: "001"
          mnc: "01"
      - plmn_id:
          mcc: "901"
          mnc: "70"
  nodeSelector:
    kubernetes.io/hostname: oran-cloud6

nssf:
  enabled: true
  image:
    registry: docker.io
    repository: gradiant/open5gs
    tag: "2.7.5"
  config:
    nsiList:
      - uri: ""
        sst: 1
        sd: "0xFFFFFF"
  nodeSelector:
    kubernetes.io/hostname: oran-cloud6

pcf:
  enabled: true
  image:
    registry: docker.io
    repository: gradiant/open5gs
    tag: "2.7.5"
  mongodb:
    enabled: false
  nodeSelector:
    kubernetes.io/hostname: oran-cloud6

scp:
  enabled: true
  image:
    registry: docker.io
    repository: gradiant/open5gs
    tag: "2.7.5"
  mongodb:
    enabled: false
  nodeSelector:
    kubernetes.io/hostname: oran-cloud6

udm:
  enabled: true
  image:
    registry: docker.io
    repository: gradiant/open5gs
    tag: "2.7.5"
  nodeSelector:
    kubernetes.io/hostname: oran-cloud6
    
udr:
  enabled: true
  image:
    registry: docker.io
    repository: gradiant/open5gs
    tag: "2.7.5"
  nodeSelector:
    kubernetes.io/hostname: oran-cloud6